name: Build Android APK

# Runs on every push to main, or by hand from the GitHub "Actions" tab
# ("Build Android APK" -> "Run workflow").
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the game code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: bun install

      - name: Build the offline game
        run: bun run build:mobile

      - name: Prepare Netlify SPA routing
        run: echo "/* /index.html 200" > dist/client/_redirects

      - name: Upload Web Build (Netlify)
        id: web-artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/client/
          if-no-files-found: error

      - name: Show web download link
        env:
          ARTIFACT_URL: ${{ steps.web-artifact.outputs.artifact-url }}
        run: |
          printf '### Web download\n[Download dist.zip](%s)\n\nSign in to GitHub to download this artifact. Extract it before deploying to Netlify.\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Unity Ads
        run: |
          DIR=android/app/src/main/java/com/crosiangames/president
          mkdir -p "$DIR"
          cp native/android/UnityAdsPlugin.java native/android/MainActivity.java "$DIR"/
          printf "\ndependencies {\n    implementation 'com.unity3d.ads:unity-ads:4.21.0'\n}\n" >> android/app/build.gradle

      - name: Add the game icon
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b1a3a' --iconBackgroundColorDark '#0b1a3a'

      - name: Set up the signing key, version and anti-tamper fingerprint
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          set -euo pipefail
          umask 077
          for NAME in KEYSTORE_B64 KS_PASS KEY_ALIAS; do
            if [ -z "${!NAME}" ]; then
              echo "::error::Missing signing credential: $NAME. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in GitHub Actions secrets."
              exit 1
            fi
          done
          KEY_PASS="${KEY_PASS:-$KS_PASS}"
          export KS_PASS KEY_PASS
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KS"; then
            echo "::error::Invalid ANDROID_KEYSTORE_BASE64. Use the contents of your original base64 file."
            exit 1
          fi
          # Fingerprint of the signing certificate, baked into MainActivity so re-signed APKs exit.
          if ! keytool -exportcert -keystore "$KS" -storepass:env KS_PASS -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/signing-cert.der" >/dev/null 2>&1; then
            echo "::error::Cannot unlock signing certificate. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi
          SHA=$(sha256sum "$RUNNER_TEMP/signing-cert.der" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')
          [[ "$SHA" =~ ^[A-F0-9]{64}$ ]]
          printf '%s\n' "$SHA" > "$RUNNER_TEMP/expected-signature.txt"
          sed -i "s/__EXPECTED_SIGNATURE__/$SHA/" android/app/src/main/java/com/crosiangames/president/MainActivity.java
          if grep -q '__EXPECTED_SIGNATURE__' android/app/src/main/java/com/crosiangames/president/MainActivity.java; then
            echo "::error::Signing certificate was not injected into the game."
            exit 1
          fi
          # Time-based code survives workflow/repository run-number resets after migration.
          VERSION_CODE=$(( $(date -u +%s) - 1577836800 ))
          test "$VERSION_CODE" -gt 0 && test "$VERSION_CODE" -lt 2100000000
          printf '%s\n' "$VERSION_CODE" > "$RUNNER_TEMP/expected-version.txt"
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file(System.getenv('RUNNER_TEMP') + '/release.keystore')
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASS') ?: System.getenv('KS_PASS')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                debuggable false
                jniDebuggable false
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              }
            }
          }
          GRADLE
          printf "\n-keep class com.getcapacitor.** { *; }\n-keep class com.crosiangames.president.** { *; }\n-keep class com.unity3d.** { *; }\n-dontwarn com.unity3d.**\n" >> android/app/proguard-rules.pro

      - name: Build the release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Confirm the APK is not debuggable
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TOOLS=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          APP_ID=$(node -p 'JSON.parse(require("fs").readFileSync("capacitor.config.json", "utf8")).appId')
          grep -F "package: name='$APP_ID' versionCode='$(cat "$RUNNER_TEMP/expected-version.txt")'" "$RUNNER_TEMP/apk-badging.txt" >/dev/null
          if grep -q "application-debuggable" "$RUNNER_TEMP/apk-badging.txt"; then echo "::error::APK is debuggable"; exit 1; fi
          "$TOOLS/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$(cat "$RUNNER_TEMP/expected-signature.txt")"
          cp "$APK" president-rise-to-power.apk

      - name: Upload the APK
        id: apk-artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: president-rise-to-power.apk
          if-no-files-found: error

      - name: Show APK download link
        env:
          ARTIFACT_URL: ${{ steps.apk-artifact.outputs.artifact-url }}
        run: |
          printf '### Android download\n[Download game-apk.zip](%s)\n\nSign in to GitHub, download and extract the ZIP, then install president-rise-to-power.apk.\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
